version: 2
env:
  - SKIP_PUBLISH={{ if index .Env "SKIP_PUBLISH" }}{{ .Env.SKIP_PUBLISH }}{{ else }}true{{ end }}
  - SKIP_DOCKER_PUSH={{ if index .Env "SKIP_DOCKER_PUSH" }}{{ .Env.SKIP_DOCKER_PUSH }}{{ else }}false{{ end }}
project_name: wardenclyffe
builds:
  - id: wardenclyffe-wasm
    dir: client/wasm/cmd
    binary: wardenclyffe
    env: [GOOS=js, GOARCH=wasm, CGO_ENABLED=0]
    goos:
      - js
    goarch:
      - wasm
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wardenclyffe
    dir: client
    binary: wardenclyffe
    env: [CGO_ENABLED=0]
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - arm
      - amd64
      - arm64
      - 386
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: 386
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  - id: wardenclyffe-static
    dir: client
    binary: wardenclyffe
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - mips
      - mipsle
      - mips64
      - mips64le
    gomips:
      - hardfloat
      - softfloat
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  - id: wardenclyffe-mgmt
    dir: management
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: wardenclyffe-mgmt
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wardenclyffe-signal
    dir: signal
    env: [CGO_ENABLED=0]
    binary: wardenclyffe-signal
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wardenclyffe-relay
    dir: relay
    env: [CGO_ENABLED=0]
    binary: wardenclyffe-relay
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wardenclyffe-server
    dir: combined
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: wardenclyffe-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wardenclyffe-upload
    dir: upload-server
    env: [CGO_ENABLED=0]
    binary: wardenclyffe-upload
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wardenclyffe-proxy
    dir: proxy/cmd/proxy
    env: [CGO_ENABLED=0]
    binary: wardenclyffe-proxy
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.BuildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wardenclyffe-idp-migrate
    dir: tools/idp-migrate
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: wardenclyffe-idp-migrate
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: wardenclyffe

archives:
  - builds:
      - wardenclyffe
      - wardenclyffe-static
  - id: wardenclyffe-wasm
    builds:
      - wardenclyffe-wasm
    name_template: "{{ .ProjectName }}_{{ .Version }}"
    format: binary
  - id: wardenclyffe-idp-migrate
    builds:
      - wardenclyffe-idp-migrate
    name_template: "wardenclyffe-idp-migrate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - maintainer: Shippin <dev@wardenclyffe.app>
    description: Wardenclyffe client.
    homepage: https://wardenclyffe.app
    license: debating/thinking/bsl
    vendor: WardenClyffe
    id: wardenclyffe_deb
    bindir: /usr/bin
    builds:
      - wardenclyffe
    formats:
      - deb
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"

  - maintainer: Shippin <dev@wardenclyffe.app>
    description: Wardenclyffe client.
    homepage: https://wardenclyffe.app
    license: debating/thinking/bsl
    vendor: WardenClyffe
    id: wardenclyffe_rpm
    bindir: /usr/bin
    builds:
      - wardenclyffe
    formats:
      - rpm
    # The client verifies TLS to management and signal against the system trust
    # store. Red Hat software certification (RPM Dependency Tracking) also
    # rejects packages that declare no dependencies at all.
    dependencies:
      - ca-certificates
    # Generated in CI by chglog from git tags; Red Hat certification requires an
    # RPM changelog (RPM Version Handling subtest).
    changelog: changelog.yml
    # License, documentation and a config file so the RPM Provenance subtest sees
    # %license, %doc and %config entries instead of a bare binary.
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/wardenclyffe/LICENSE
        type: license
      - src: README.md
        dst: /usr/share/doc/wardenclyffe/README.md
        type: doc
      - src: release_files/wardenclyffe.sysconfig
        dst: /etc/sysconfig/wardenclyffe
        type: config|noreplace
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"
    rpm:
      summary: WardenClyffe client
      group: Applications/Internet
      packager: WardenClyffe <dev@wardenclyffe.app>
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'
dockers_v2:
   - id: wardenclyffe
     disable: "{{ .Env.SKIP_DOCKER_PUSH }}"
     ids:
       - wardenclyffe
     images:
       - shippin/wardenclyffe
       - ghcr.io/shippin/wardenclyffe
     tags:
       - "{{ .Version }}"
       - "{{ if eq .Env.SKIP_PUBLISH \"false\" }}latest{{ end }}"
     dockerfile: client/Dockerfile
     extra_files:
       - client/wardenclyffe-entrypoint.sh
     platforms:
       - linux/amd64
       - linux/arm64
       - linux/arm/6
     annotations:
       "org.opencontainers.image.created": "{{.Date}}"
       "org.opencontainers.image.title": "{{.ProjectName}}"
       "org.opencontainers.image.version": "{{.Version}}"
       "org.opencontainers.image.revision": "{{.FullCommit}}"
       "org.opencontainers.image.source": "{{.GitURL}}"
