brews:
  - ids:
      - default
    skip_upload: "{{ .Env.SKIP_PUBLISH }}"
    repository:
      owner: shippin/wardenclyffe
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Wardenclyffe
      email: dev@wardenclyffe.app
    description: Wardenclyffe project.
    download_strategy: CurlDownloadStrategy
    homepage: https://wardenclyffe.app
    license: "BSD3"
    test: |
      system "#{bin}/{{ .ProjectName	}} version"

uploads:
  - name: debian
    skip: "{{ .Env.SKIP_PUBLISH }}"
    ids:
      - wardenclyffe_deb
    mode: archive
    target: https://pkgs.wiretrustee.com/debian/pool/{{ .ArtifactName }};deb.distribution=stable;deb.component=main;deb.architecture={{ if .Arm }}armhf{{ else }}{{ .Arch }}{{ end }};deb.package=
    username: dev@wiretrustee.com
    method: PUT

  - name: yum
    skip: "{{ .Env.SKIP_PUBLISH }}"
    ids:
      - wardenclyffe_rpm
    mode: archive
    target: https://pkgs.wiretrustee.com/yum/{{ .Arch }}{{ if .Arm }}{{ .Arm }}{{ end }}
    username: dev@wiretrustee.com
    method: PUT

checksum:
  extra_files:
    - glob: ./infrastructure_files/getting-started-with-zitadel.sh
    - glob: ./release_files/install.sh
    - glob: ./infrastructure_files/getting-started.sh
    - glob: ./infrastructure_files/getting-started-enterprise.sh
    - glob: ./infrastructure_files/migrate-to-enterprise.sh

release:
  # The signing pipeline (shippin/wardenclyffe/sign-pipelines, dispatched by
  # trigger_signer) marks the release latest once the Windows and macOS
  # artifacts are signed. Without this override goreleaser marks it latest
  # at publish time, while those artifacts are still unsigned.
  make_latest: false
  # Mark x.y.z-rc.* and other prerelease tags as prereleases on GitHub.
  prerelease: auto
  extra_files:
    - glob: ./infrastructure_files/getting-started-with-zitadel.sh
    - glob: ./release_files/install.sh
    - glob: ./infrastructure_files/getting-started.sh
    - glob: ./infrastructure_files/getting-started-enterprise.sh
    - glob: ./infrastructure_files/migrate-to-enterprise.sh
