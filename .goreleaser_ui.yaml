version: 2
env:
  - SKIP_PUBLISH={{ if index .Env "SKIP_PUBLISH" }}{{ .Env.SKIP_PUBLISH }}{{ else }}true{{ end }}
project_name: wardenclyffe-ui

before:
  hooks:
    # Bindings are gitignored; regenerate before the frontend build so
    # the @wailsio/runtime Vite plugin can resolve them (vite refuses to
    # build without them).
    - sh -c 'cd client/ui && wails3 generate bindings -clean=true -ts'
    - sh -c 'cd client/ui/frontend && pnpm install --frozen-lockfile && pnpm build'

builds:
  - id: wardenclyffe-ui
    dir: client/ui
    binary: wardenclyffe-ui
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

  - id: wardenclyffe-ui-windows-amd64
    dir: client/ui
    binary: wardenclyffe-ui
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

  - id: wardenclyffe-ui-windows-arm64
    dir: client/ui
    binary: wardenclyffe-ui
    env:
      - CGO_ENABLED=1
      - CC=aarch64-w64-mingw32-clang
      - CXX=aarch64-w64-mingw32-clang++
    goos:
      - windows
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/shippin/wardenclyffe/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

archives:
  - id: linux-arch
    name_template: "{{ .ProjectName }}-linux_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - wardenclyffe-ui
  - id: windows-arch
    name_template: "{{ .ProjectName }}-windows_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - wardenclyffe-ui-windows-amd64
      - wardenclyffe-ui-windows-arm64

nfpms:
  - maintainer: Shippin <dev@wardenclyffe.app>
    description: Wardenclyffe client UI.
    homepage: https://wardenclyffe.app
    license: debating/thinking/bsl
    vendor: WardenClyffe
    id: wardenclyffe_ui_deb
    package_name: wardenclyffe-ui
    builds:
      - wardenclyffe-ui
    formats:
      - deb
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/linux/wardenclyffe.desktop
        dst: /usr/share/applications/org.wails.wardenclyffe.desktop
      - src: client/ui/build/appicon.png
        dst: /usr/share/pixmaps/wardenclyffe.png
      # Names the polkit action for the elevation prompt the app raises when an
      # unprivileged user changes a privileged setting; without it the dialog
      # shows a raw command line.
      - src: client/ui/build/linux/polkit/io.wardenclyffe.settings.policy
        dst: /usr/share/polkit-1/actions/io.wardenclyffe.settings.policy
    dependencies:
      - wardenclyffe (>= 0.75.0)
      - libgtk-4-1 (>= 4.14)
      - libwebkitgtk-6.0-4
      - xdg-utils

  - maintainer: Shippin <dev@wardenclyffe.app>
    description: Wardenclyffe client UI.
    homepage: https://wardenclyffe.app
    license: debating/thinking/bsl
    vendor: WardenClyffe
    id: wardenclyffe_ui_rpm
    package_name: wardenclyffe-ui
    builds:
      - wardenclyffe-ui
    formats:
      - rpm
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/linux/wardenclyffe.desktop
        dst: /usr/share/applications/org.wails.wardenclyffe.desktop
      - src: client/ui/build/appicon.png
        dst: /usr/share/pixmaps/wardenclyffe.png
      # Names the polkit action for the elevation prompt the app raises when an
      # unprivileged user changes a privileged setting; without it the dialog
      # shows a raw command line.
      - src: client/ui/build/linux/polkit/io.wardenclyffe.settings.policy
        dst: /usr/share/polkit-1/actions/io.wardenclyffe.settings.policy
    dependencies:
      - wardenclyffe >= 0.75.0
      - (gtk4 >= 4.14 or libgtk-4-1 >= 4.14)
      - (webkitgtk6.0 or libwebkitgtk-6_0-4)
      - xdg-utils

    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'

uploads:
  - name: debian
    skip: "{{ .Env.SKIP_PUBLISH }}"
    ids:
      - wardenclyffe_ui_deb
    mode: archive
    target: https://pkgs.wiretrustee.com/debian/pool/{{ .ArtifactName }};deb.distribution=stable;deb.component=main;deb.architecture={{ if .Arm }}armhf{{ else }}{{ .Arch }}{{ end }};deb.package=
    username: dev@wiretrustee.com
    method: PUT

  - name: yum
    skip: "{{ .Env.SKIP_PUBLISH }}"
    ids:
      - wardenclyffe_ui_rpm
    mode: archive
    target: https://pkgs.wiretrustee.com/yum/{{ .Arch }}{{ if .Arm }}{{ .Arm }}{{ end }}
    username: dev@wiretrustee.com
    method: PUT

release:
  # Uploads into the release created by the main .goreleaser.yaml run.
  # make_latest stays false everywhere: the signing pipeline
  # (shippin/wardenclyffe/sign-pipelines) marks the release latest after the Windows
  # and macOS artifacts are signed.
  make_latest: false
  prerelease: auto
